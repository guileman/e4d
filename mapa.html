<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <title>Ortofoto</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/e4d-icono.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <meta property="og:image" content="https://e4d.com.ar/assets/brand/e4d-og.png">
  <meta name="theme-color" content="#0e0f11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/ol/ol.css">
  <link rel="stylesheet" href="assets/styles.css?v=23">
  <link rel="stylesheet" href="assets/mapa.css?v=23">
  <script src="assets/vendor/ol/ol.js"></script>
  <script src="assets/vendor/proj4.js"></script>
</head>
<body class="map-page">
  <div id="map" class="map"></div>

  <header class="topbar">
    <a class="icon-btn" id="back" href="./#galeria" title="Volver" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 id="title">Ortofoto</h1>
    <span class="spacer"></span>
    <a class="icon-btn" id="to3d" href="#" title="Ver modelo 3D" aria-label="Ver modelo 3D">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
    </a>
    <button class="icon-btn on" id="btn-side" title="Panel" aria-label="Mostrar u ocultar panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </header>

  <nav class="tools" id="tools" aria-label="Herramientas de medición">
    <button data-tool="nav" class="tool on" title="Navegar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 7-6 2-2 6z"/></svg><span>Navegar</span>
    </button>
    <button data-tool="distancia" class="tool" title="Medir distancia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>Distancia</span>
    </button>
    <button data-tool="superficie" class="tool" title="Medir superficie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l7-4 9 6-3 11H6z"/></svg><span>Superficie</span>
    </button>
    <button data-tool="angulo" class="tool" title="Medir ángulo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L20 6M4 20h16"/><path d="M12 20a8 8 0 0 0-2.3-5.6"/></svg><span>Ángulo</span>
    </button>
    <button data-tool="punto" class="tool" title="Coordenadas de un punto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span>Punto</span>
    </button>
    <button data-action="borrar" class="tool" title="Borrar mediciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span>Borrar</span>
    </button>
  </nav>

  <div class="tool-hint" id="tool-hint" hidden></div>

  <aside class="side" id="side">
    <section>
      <h2>Mediciones</h2>
      <p class="muted small" id="meas-empty">Elegí una herramienta y hacé clic sobre la ortofoto. Doble clic para terminar una línea o superficie.</p>
      <ol class="meas" id="meas"></ol>
    </section>

    <section>
      <h2>Capas</h2>
      <label class="chk"><input type="checkbox" id="lyr-orto" checked> Ortofoto</label>
      <label class="chk"><input type="checkbox" id="lyr-gcp" checked> Puntos de control (GCP)</label>
      <label class="chk"><input type="checkbox" id="lyr-sat" checked> Fondo satelital</label>
      <label class="range">Opacidad ortofoto <input type="range" id="orto-op" min="0" max="100" value="100"></label>
    </section>

    <section id="gcp-sec" hidden>
      <h2>Puntos de control</h2>
      <p class="muted small">Tocá un punto para centrarlo. Coordenadas en UTM 20S (EPSG:32720).</p>
      <div class="tbl-wrap"><table class="gcp-tbl" id="gcp-tbl"></table></div>
      <div class="dl" id="gcp-dl"></div>
    </section>

    <section id="dl-sec" hidden>
      <h2>Descargas</h2>
      <div class="dl" id="orto-dl"></div>
    </section>
  </aside>

  <div class="coords mono" id="coords"></div>
  <div class="popup" id="popup"></div>

  <script src="assets/app.js?v=23"></script>
  <script src="assets/mapa.js?v=23"></script>
  <script>initMapa();</script>
</body>
</html>
